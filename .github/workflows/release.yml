name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    name: Package release
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and release ancestry
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            python3 scripts/version.py --check-tag "$RELEASE_TAG"
            git merge-base --is-ancestor HEAD origin/main
          fi
      - run: ./scripts/check.sh
      - run: ./scripts/create-dmg.sh
      - run: python3 scripts/check-bundle.py
      - name: Prepare download names and checksums
        run: |
          VERSION=$(python3 scripts/version.py)
          mkdir -p build/release
          cp "build/Vibote-$VERSION.dmg" build/release/
          cp build/Vibote.dmg build/release/
          (cd build/release && shasum -a 256 *.dmg > SHA256SUMS.txt)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Vibote-release
          path: build/release/
          retention-days: 14
          if-no-files-found: error
      - name: Create draft release for human verification
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" build/release/* --verify-tag --draft \
            --title "Vibote $RELEASE_TAG" --notes-file maintenance/release-notes.md
