name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Build and checks
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./scripts/check.sh
      - run: ./scripts/build.sh
      - name: Verify signed universal bundles
        run: python3 scripts/check-bundle.py
      - name: Verify installer packaging
        run: ./scripts/create-dmg.sh --skip-build
